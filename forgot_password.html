{% extends 'layout.html' %}

{% block auth_content %}
<div class="auth-box">
    <div class="auth-header">
        <i class="fa-solid fa-lock auth-logo"></i>
        <h1>Reset Password</h1>
        <p>Enter your email to receive a secure reset link</p>
    </div>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert-error">
              <i class="fa-solid fa-circle-info"></i> {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <div>
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" required placeholder="doctor@clinic.com">
        </div>
        <button type="submit" class="btn-primary btn-full">Generate Secure Link</button>
    </form>
    
    <div class="auth-footer">
        <p class="auth-footer-text">
            <a href="{{ url_for('login') }}" class="auth-link">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
