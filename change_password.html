{% extends 'layout.html' %}

{% block content %}

    <a href="/" class="btn-secondary">Cancel</a>
</div>

<div class="vitals-container">
    <form method="POST">
        <div class="vitals-grid">
            <div class="vitals-input-group">
                <label class="vitals-label">Current Password</label>
                <input type="password" name="old_password" class="vitals-control" required>
            </div>
            <div class="vitals-input-group">
                <label class="vitals-label">New Password</label>
                <input type="password" name="new_password" class="form-control" required>
