{% extends 'layout.html' %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title"><i class="fa-solid fa-video icon-blue-text"></i> Telehealth Session</h1>
        <p class="page-subtitle">Consultation with: <strong class="text-dark">{{ appt.patient.first_name }} {{ appt.patient.last_name }}</strong></p>
    </div>
    <div class="header-actions">
        <a href="{{ url_for('telehealth_dashboard') }}" class="btn-secondary btn-secondary-dark">
            <i class="fa-solid fa-arrow-left"></i> Leave Room
        </a>
        <a href="/appointments/soap/{{ appt.id }}" class="btn-primary" target="_blank">
            <i class="fa-solid fa-notes-medical"></i> Write SOAP Note
        </a>
    </div>
</div>

<!-- Video Call Container -->
<div class="video-consultation-wrapper" id="jitsi-container"></div>

<!-- Jitsi Meet API (No Installation Required) -->
<script src="https://meet.jit.si/external_api.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const domain = 'meet.jit.si';
        const options = {
            roomName: '{{ appt.meeting_room_id }}', // App.py se aane wala unique secure ID
            width: '100%',
            height: '100%',
            parentNode: document.querySelector('#jitsi-container'),
            userInfo: {
                displayName: 'Dr. {{ current_user.name }}'
            },
            configOverwrite: {
                startWithAudioMuted: false,
                startWithVideoMuted: false,
                prejoinPageEnabled: false, // Direct enter room without extra screen
                disableDeepLinking: true // Disables the "Download App" prompt
            },
            interfaceConfigOverwrite: {
                TOOLBAR_BUTTONS: [
                    'microphone', 'camera', 'desktop', 'fullscreen',
                    'hangup', 'chat', 'recording', 'settings', 'raisehand',
                    'videoquality', 'filmstrip', 'tileview', 'videobackgroundblur'
                ],
                SHOW_JITSI_WATERMARK: false,
                SHOW_BRAND_WATERMARK: false,
            }
        };
        
        const api = new JitsiMeetExternalAPI(domain, options);
        
        // Jab doctor red Hangup button dabaye ga toh automatically dashboard par wapas chala jayega
        api.addEventListener('videoConferenceLeft', function () {
            window.location.href = "{{ url_for('telehealth_dashboard') }}";
        });
    });
</script>
{% endblock %}
