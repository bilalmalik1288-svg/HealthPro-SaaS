{% extends "layout.html" %}
{% block content %}

<h2 class="page-title">Edit Appointment</h2>

<form method="POST" class="ehr-form">

    <!-- Select Patient -->
    <div class="form-row">
        <label>Select Patient</label>
        <select name="patient_id" required>
            {% for p in patients %}
                <option value="{{ p.id }}"
                    {% if p.id == appointment.patient_id %}selected{% endif %}>
                    {{ p.first_name }} {{ p.last_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- Doctor Name -->
    <div class="form-row">
        <label>Doctor Name</label>
        <input type="text" name="doctor_name"
               value="{{ appointment.doctor_name }}" required>
    </div>

    <!-- Appointment Date -->
    <div class="form-row">
        <label>Appointment Date</label>
        <input type="date" name="appointment_date"
               value="{{ appointment.appointment_date }}" required>
    </div>

    <!-- Appointment Time -->
    <div class="form-row">
        <label>Appointment Time</label>
        <input type="time" name="appointment_time"
               value="{{ appointment.appointment_time }}" required>
    </div>

    <!-- Status -->
    <div class="form-row">
        <label>Status</label>
        <select name="status">
            <option {% if appointment.status=="Scheduled" %}selected{% endif %}>
                Scheduled
            </option>
            <option {% if appointment.status=="Completed" %}selected{% endif %}>
                Completed
            </option>
            <option {% if appointment.status=="Cancelled" %}selected{% endif %}>
                Cancelled
            </option>
        </select>
    </div>

    <!-- Buttons -->
    <button class="btn-primary">Save Changes</button>

    <a href="/appointments" class="btn-secondary">
        Back
    </a>

    <a href="/appointments/delete/{{ appointment.id }}"
       class="btn-danger"
       onclick="return confirm('Delete this appointment?');">
        Delete
    </a>

</form>

{% endblock %}
