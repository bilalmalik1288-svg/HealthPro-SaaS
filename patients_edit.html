{% extends "layout.html" %}
{% block content %}
<header class="page-header">
    <div>
        <h1>{{ 'Edit Patient Record' if patient else 'Register New Patient' }}</h1>
        <p>{{ 'Update patient details securely.' if patient else 'Enter patient details securely.' }}</p>
    </div>
</header>

<form action="{{ '/patients/edit/' ~ patient.id if patient else '/add' }}" method="POST">
    
    <div class="form-section">
        <div class="section-title">Personal Information</div>
        <div class="form-grid">
            <div>
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control" value="{{ patient.first_name if patient else '' }}" required>
            </div>
            <div>
                <label class="form-label">Middle Name</label>
                <input type="text" name="middle_name" class="form-control" placeholder="Optional" value="{{ patient.middle_name if patient else '' }}">
            </div>
            <div>
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control" value="{{ patient.last_name if patient else '' }}" required>
            </div>
            <div>
                <label class="form-label">SSN (Last 4 Digits)</label>
                <input type="text" name="ssn_last_4" class="form-control" placeholder="XXX-XX-XXXX" maxlength="4" pattern="[0-9]{4}" value="{{ patient.ssn_last_4 if patient and patient.ssn_last_4 else '' }}">
            </div>
            <div>
                <label class="form-label">Date of Birth</label>
                <input type="date" name="dob" class="form-control" value="{{ patient.dob.strftime('%Y-%m-%d') if patient and patient.dob else '' }}" required>
            </div>
            <div>
                <label class="form-label">Gender</label>
                <select name="gender" class="form-control">
                    <option value="Male" {% if patient and patient.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if patient and patient.gender == 'Female' %}selected{% endif %}>Female</option>
                </select>
            </div>
        </div>
    </div>

    <div class="form-section">
        <div class="section-title">Contact & Location</div>
        <div class="form-grid">
            <div>
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ patient.phone if patient else '' }}" required>
            </div>
            <div>
                <label class="form-label">Secondary Phone</label>
                <input type="text" name="secondary_phone" class="form-control" placeholder="Optional" value="{{ patient.secondary_phone if patient else '' }}">
            </div>
            <div>
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" value="{{ patient.email if patient else '' }}">
            </div>
            <div class="span-2">
                <label class="form-label">Street Address</label>
                <input type="text" name="address" class="form-control" value="{{ patient.address if patient else '' }}">
            </div>
            <div>
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-control" placeholder="e.g. New York" value="{{ patient.city if patient and patient.city else '' }}">
            </div>
            <div>
                <label class="form-label">State</label>
                <select name="state" class="form-control">
                    <option value="">Select State</option>
                    <option value="AL" {% if patient and patient.state == 'AL' %}selected{% endif %}>Alabama</option>
                    <option value="AK" {% if patient and patient.state == 'AK' %}selected{% endif %}>Alaska</option>
                    <option value="AZ" {% if patient and patient.state == 'AZ' %}selected{% endif %}>Arizona</option>
                    <option value="AR" {% if patient and patient.state == 'AR' %}selected{% endif %}>Arkansas</option>
                    <option value="CA" {% if patient and patient.state == 'CA' %}selected{% endif %}>California</option>
                    <option value="CO" {% if patient and patient.state == 'CO' %}selected{% endif %}>Colorado</option>
                    <option value="CT" {% if patient and patient.state == 'CT' %}selected{% endif %}>Connecticut</option>
                    <option value="DE" {% if patient and patient.state == 'DE' %}selected{% endif %}>Delaware</option>
                    <option value="DC" {% if patient and patient.state == 'DC' %}selected{% endif %}>District Of Columbia</option>
                    <option value="FL" {% if patient and patient.state == 'FL' %}selected{% endif %}>Florida</option>
                    <option value="GA" {% if patient and patient.state == 'GA' %}selected{% endif %}>Georgia</option>
                    <option value="HI" {% if patient and patient.state == 'HI' %}selected{% endif %}>Hawaii</option>
                    <option value="ID" {% if patient and patient.state == 'ID' %}selected{% endif %}>Idaho</option>
                    <option value="IL" {% if patient and patient.state == 'IL' %}selected{% endif %}>Illinois</option>
                    <option value="IN" {% if patient and patient.state == 'IN' %}selected{% endif %}>Indiana</option>
                    <option value="IA" {% if patient and patient.state == 'IA' %}selected{% endif %}>Iowa</option>
                    <option value="KS" {% if patient and patient.state == 'KS' %}selected{% endif %}>Kansas</option>
                    <option value="KY" {% if patient and patient.state == 'KY' %}selected{% endif %}>Kentucky</option>
                    <option value="LA" {% if patient and patient.state == 'LA' %}selected{% endif %}>Louisiana</option>
                    <option value="ME" {% if patient and patient.state == 'ME' %}selected{% endif %}>Maine</option>
                    <option value="MD" {% if patient and patient.state == 'MD' %}selected{% endif %}>Maryland</option>
                    <option value="MA" {% if patient and patient.state == 'MA' %}selected{% endif %}>Massachusetts</option>
                    <option value="MI" {% if patient and patient.state == 'MI' %}selected{% endif %}>Michigan</option>
                    <option value="MN" {% if patient and patient.state == 'MN' %}selected{% endif %}>Minnesota</option>
                    <option value="MS" {% if patient and patient.state == 'MS' %}selected{% endif %}>Mississippi</option>
                    <option value="MO" {% if patient and patient.state == 'MO' %}selected{% endif %}>Missouri</option>
                    <option value="MT" {% if patient and patient.state == 'MT' %}selected{% endif %}>Montana</option>
                    <option value="NE" {% if patient and patient.state == 'NE' %}selected{% endif %}>Nebraska</option>
                    <option value="NV" {% if patient and patient.state == 'NV' %}selected{% endif %}>Nevada</option>
                    <option value="NH" {% if patient and patient.state == 'NH' %}selected{% endif %}>New Hampshire</option>
                    <option value="NJ" {% if patient and patient.state == 'NJ' %}selected{% endif %}>New Jersey</option>
                    <option value="NM" {% if patient and patient.state == 'NM' %}selected{% endif %}>New Mexico</option>
                    <option value="NY" {% if patient and patient.state == 'NY' %}selected{% endif %}>New York</option>
                    <option value="NC" {% if patient and patient.state == 'NC' %}selected{% endif %}>North Carolina</option>
                    <option value="ND" {% if patient and patient.state == 'ND' %}selected{% endif %}>North Dakota</option>
                    <option value="OH" {% if patient and patient.state == 'OH' %}selected{% endif %}>Ohio</option>
                    <option value="OK" {% if patient and patient.state == 'OK' %}selected{% endif %}>Oklahoma</option>
                    <option value="OR" {% if patient and patient.state == 'OR' %}selected{% endif %}>Oregon</option>
                    <option value="PA" {% if patient and patient.state == 'PA' %}selected{% endif %}>Pennsylvania</option>
                    <option value="RI" {% if patient and patient.state == 'RI' %}selected{% endif %}>Rhode Island</option>
                    <option value="SC" {% if patient and patient.state == 'SC' %}selected{% endif %}>South Carolina</option>
                    <option value="SD" {% if patient and patient.state == 'SD' %}selected{% endif %}>South Dakota</option>
                    <option value="TN" {% if patient and patient.state == 'TN' %}selected{% endif %}>Tennessee</option>
                    <option value="TX" {% if patient and patient.state == 'TX' %}selected{% endif %}>Texas</option>
                    <option value="UT" {% if patient and patient.state == 'UT' %}selected{% endif %}>Utah</option>
                    <option value="VT" {% if patient and patient.state == 'VT' %}selected{% endif %}>Vermont</option>
                    <option value="VA" {% if patient and patient.state == 'VA' %}selected{% endif %}>Virginia</option>
                    <option value="WA" {% if patient and patient.state == 'WA' %}selected{% endif %}>Washington</option>
                    <option value="WV" {% if patient and patient.state == 'WV' %}selected{% endif %}>West Virginia</option>
                    <option value="WI" {% if patient and patient.state == 'WI' %}selected{% endif %}>Wisconsin</option>
                    <option value="WY" {% if patient and patient.state == 'WY' %}selected{% endif %}>Wyoming</option>
                </select>
            </div>
            <div>
                <label class="form-label">Zip Code</label>
                <input type="text" name="zip_code" class="form-control" value="{{ patient.zip_code if patient else '' }}">
            </div>
            <div>
                <label class="form-label">Country</label>
                <!-- Fixed: Country is locked to USA -->
                <input type="text" name="country" class="form-control" value="USA" readonly>
            </div>
        </div>
    </div>

    <div class="form-section">
        <div class="section-title">Insurance & Clinical Details</div>
        <div class="form-grid">
            <div class="span-2">
                <label class="form-label">Insurance Provider</label>
                <input type="text" name="insurance_provider" class="form-control" value="{{ patient.insurance_provider if patient else '' }}">
            </div>
            <div>
                <label class="form-label">Member ID</label>
                <input type="text" name="insurance_member_id" class="form-control" value="{{ patient.insurance_member_id if patient else '' }}">
            </div>
            <div>
                <label class="form-label">Group Number</label>
                <input type="text" name="insurance_group_number" class="form-control" value="{{ patient.insurance_group_number if patient and patient.insurance_group_number else '' }}">
            </div>
            <div class="span-2">
                <label class="form-label">Known Allergies</label>
                <textarea name="allergies" class="form-control" rows="2" placeholder="List any drug or food allergies here...">{{ patient.allergies if patient and patient.allergies else '' }}</textarea>
            </div>
            <div class="span-2">
                <label class="form-label">Emergency Contact (Name & Phone)</label>
                <input type="text" name="emergency_contact" class="form-control" placeholder="e.g. Jane Doe - (555) 999-8888" value="{{ patient.emergency_contact if patient and patient.emergency_contact else '' }}">
            </div>
        </div>
    </div>
    
    <div class="form-actions">
        <button type="submit" class="btn-primary btn-large">{{ 'Update Record' if patient else 'Save Record' }}</button>
        <a href="/patients" class="cancel-link">Cancel</a>
    </div>
</form>
{% endblock %}
